<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>About Wilson LIN</title>
  <style>
    :root {
      --bg-1: #040508;
      --bg-2: #101223;
      --panel: rgba(13, 15, 28, 0.85);
      --panel-border: rgba(105, 120, 255, 0.3);
      --text: #e8eaed;
      --muted: rgba(232, 234, 237, 0.6);
      --accent: #d2a8ff;
      --prompt: #669df6;
      --error: #f28b82;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      --glow-1: rgba(102, 157, 246, 0.15);
      --glow-2: rgba(210, 168, 255, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-weight: bold;
      letter-spacing: 0.1em;
      background:
        radial-gradient(circle at top left, var(--glow-1), transparent 40%),
        radial-gradient(circle at bottom right, var(--glow-2), transparent 40%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }

    .terminal {
      width: min(100%, 1000px);
      height: min(95vh, 920px);
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(210, 168, 255, 0.4);
      border-radius: 18px;
      overflow: hidden;
      background: var(--panel);
      box-shadow: 
        var(--shadow), 
        0 0 15px rgba(102, 157, 246, 0.2), 
        inset 0 0 20px rgba(210, 168, 255, 0.15);
      backdrop-filter: blur(10px);
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .terminal:hover {
      box-shadow: 
        var(--shadow), 
        0 0 25px rgba(102, 157, 246, 0.3), 
        inset 0 0 30px rgba(210, 168, 255, 0.2);
      border-color: rgba(210, 168, 255, 0.6);
    }

    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--panel-border);
    }

    .window-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .window-controls {
      display: flex;
      gap: 8px;
      flex: none;
    }

    .control {
      width: 12px;
      height: 12px;
      border-radius: 999px;
    }

    .control.red { background: #ff5f57; }
    .control.yellow { background: #febc2e; }
    .control.green { background: #28c840; }

    .output {
      flex: 1;
      padding: 24px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.7;
      font-size: 1rem;
      scrollbar-width: none;
    }

    .output::-webkit-scrollbar {
      display: none;
    }

    .line {
      margin-bottom: 0.35rem;
    }

    .prompt-line {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
      flex-wrap: wrap;
      overflow: hidden;
    }

    .prompt {
      color: var(--prompt);
      user-select: none;
      flex: none;
    }

    .command-input {
      min-width: 0;
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--accent);
      font-family: inherit;
      font-size: inherit;
      font-weight: bold;
      letter-spacing: inherit;
      caret-color: var(--accent);
      padding: 0;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      min-width: 12ch;
      overflow-x: auto;
      white-space: nowrap;
    }

    .command-input::placeholder {
      color: rgba(215, 251, 230, 0.35);
      opacity: 1;
    }

    .command-output {
      color: var(--accent);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      max-width: calc(100% - 6ch);
      display: inline-block;
    }

    .error {
      color: var(--error);
    }

    .clickable {
      color: var(--prompt);
      cursor: pointer;
      font-weight: bold;
    }
    .clickable:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    @media (max-width: 640px) {
      body {
        padding: 8px;
      }

      .terminal {
        width: 100%;
        height: calc(100vh - 16px);
        border-radius: 14px;
      }

      .title-bar {
        padding: 10px 12px;
      }

      .output {
        padding: 16px;
        font-size: 0.95rem;
      }

      .command-input {
        min-width: 8ch;
      }
    }
  </style>
</head>
<body>

  <div class="terminal">
    <div class="title-bar">
      <div class="window-title">root@wilsonlin9769:/profile/portfolio</div>
      <div class="window-controls" aria-hidden="true">
        <div class="control green"></div>
        <div class="control yellow"></div>
        <div class="control red"></div>
      </div>
    </div>
    <div id="output" class="output"></div>
  </div>

  <script src="data.js"></script>
  <script>
    const output = document.getElementById('output');
    const promptText = 'root@wilsonlin9769:/profile/portfolio';

    let currentInput = null;
    let currentPromptLine = null;
    let awaitingClearConfirm = false;

    // Detect browser language and set default
    const userLang = navigator.language || navigator.userLanguage;
    if (userLang && userLang.toLowerCase().includes('zh')) {
      terminalData.currentLang = 'tw';
    } else {
      terminalData.currentLang = 'en';
    }

    // Helper to get current locale data
    function t() {
      return terminalData[terminalData.currentLang];
    }

    function appendLine(text, className = '', isHtml = false) {
      const line = document.createElement('div');
      line.className = className ? `line ${className}` : 'line';
      if (isHtml) {
        line.innerHTML = text;
      } else {
        line.textContent = text;
      }
      output.appendChild(line);
      output.scrollTop = output.scrollHeight;
    }

    function runCmd(cmd) {
      if (currentInput && currentPromptLine) {
        // Find the visible input field and execute
        executeCommand(cmd, currentPromptLine, currentInput);
      }
    }

    function createPrompt() {
      const promptLine = document.createElement('div');
      promptLine.className = 'prompt-line';

      const promptLabel = document.createElement('span');
      promptLabel.className = 'prompt';
      promptLabel.textContent = 'root@wilsonlin9769:~$';

      const input = document.createElement('input');
      input.className = 'command-input';
      input.type = 'text';
      input.placeholder = 'Type a command...';
      input.setAttribute('aria-label', 'Terminal command input');

      promptLine.append(promptLabel, input);

      input.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();

        executeCommand(input.value.trim(), promptLine, input);
      });

      output.appendChild(promptLine);
      output.scrollTop = output.scrollHeight;
      input.focus();

      currentInput = input;
      currentPromptLine = promptLine;
    }

    function executeCommand(cmd, promptLine, input) {
      // Build a history line containing the prompt label and the entered command
      const historyLine = document.createElement('div');
      historyLine.className = 'line';

      const histPrompt = document.createElement('span');
      histPrompt.className = 'prompt';
      histPrompt.textContent = 'root@wilsonlin9769:~$ ';

      const histCommand = document.createElement('span');
      histCommand.className = 'command-output';
      histCommand.textContent = cmd || '';

      historyLine.append(histPrompt, histCommand);
      promptLine.replaceWith(historyLine);

      if (!cmd) {
        if (awaitingClearConfirm) {
          awaitingClearConfirm = false;
          appendLine(t().clearCancelled);
          createPrompt();
          return;
        }
        createPrompt();
        return;
      }

      const rawCmdArgs = cmd.split(' ');
      const mainCmd = rawCmdArgs[0].toLowerCase();
      const arg = rawCmdArgs.length > 1 ? rawCmdArgs[1].toLowerCase() : null;

      if (awaitingClearConfirm) {
        awaitingClearConfirm = false;
        if (mainCmd === 'y' || mainCmd === 'yes') {
          output.innerHTML = '';
        } else {
          appendLine(t().clearCancelled);
        }
        createPrompt();
        return;
      }

      switch (mainCmd) {
        case 'help':
          appendLine(t().help, '', true);
          break;
        case 'lang':
          if (arg === '-en' || (!arg && terminalData.currentLang === 'tw')) {
            terminalData.currentLang = 'en';
            appendLine(t().langSwitched);
          } else if (arg === '-tw' || (!arg && terminalData.currentLang === 'en')) {
            terminalData.currentLang = 'tw';
            appendLine(t().langSwitched);
          } else {
            appendLine(t().langErr, 'error');
          }
          break;
        case 'about':
          appendLine(t().about);
          break;
        case 'story':
          appendLine(t().story);
          break;
        case 'skills':
          appendLine(t().skills);
          break;
        case 'contact':
          appendLine(t().contactEmailHtml, '', true);
          break;
        case 'projects':
          appendLine(t().projects);
          break;
        case 'connect':
          appendLine(t().connectRestricted + t().connectPromoHtml, '', true);
          break;
        case 'resume':
          appendLine(t().resumeHtml, '', true);
          break;
        case 'fetch':
          appendLine(t().fetch, '', true);
          break;
        case 'whoami':
          appendLine('Wilson LIN - digital craftsman & terminal enthusiast');
          break;
        case 'clear':
          awaitingClearConfirm = true;
          appendLine(t().clearConfirm, '', true);
          break;
        case 'sudo':
          if (arg === 'connect') {
            appendLine(t().connectAllHtml, '', true);
          } else if (arg === 'contact' || arg === 'contacts') {
            appendLine(t().contactEmailHtml + '\n\n' + t().contactPhoneHtml, '', true);
          } else {
            appendLine(t().sudo, 'error');
          }
          break;
        default:
          appendLine(t().commandNotFound + cmd, 'error');
      }

      createPrompt();
    }

    function boot() {
      output.innerHTML = '';
      appendLine(t().initMsg1);
      appendLine(t().initMsg2);
      appendLine(t().initMsg3, '', true);
      createPrompt();
    }

    window.onload = boot;
  </script>
</body>
</html>
