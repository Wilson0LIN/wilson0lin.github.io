<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Wilson LIN's personal space.">
  <meta name="theme-color" content="#f5f5f2">
  <title>Wilson LIN</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef5f3;
      --surface: rgba(255, 255, 255, 0.72);
      --ink: #151817;
      --muted: #747a75;
      --line: rgba(21, 24, 23, 0.15);
      --accent: #70b7aa;
      --accent-ink: #102c2b;
      --blue: #23656b;
      --shadow: 0 20px 60px rgba(21, 24, 23, 0.1);
      --display: Georgia, "Times New Roman", serif;
      --sans: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #102526;
        --surface: rgba(31, 36, 34, 0.8);
        --ink: #f2f4ed;
        --muted: #a4aaa3;
        --line: rgba(242, 244, 237, 0.18);
        --accent: #5da99e;
        --accent-ink: #102526;
        --blue: #8ac8c2;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      }
    }

    :root[data-theme="light"] { color-scheme: light; --bg: #eef5f3; --surface: rgba(255, 255, 255, 0.72); --ink: #151817; --muted: #647572; --line: rgba(21, 24, 23, 0.15); --blue: #23656b; --shadow: 0 20px 60px rgba(21, 24, 23, 0.1); }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #102526; --surface: rgba(24, 45, 45, 0.8); --ink: #eff7f3; --muted: #a5bcb7; --line: rgba(239, 247, 243, 0.18); --blue: #8ac8c2; --shadow: 0 20px 60px rgba(0, 0, 0, 0.25); }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body { min-height: 100vh; margin: 0; overflow-x: hidden; color: var(--ink); background: var(--bg); font-family: var(--sans); -webkit-font-smoothing: antialiased; transition: color 220ms ease, background 220ms ease; }
    body::before { position: fixed; inset: 0; z-index: -2; pointer-events: none; content: ""; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 42px 42px; opacity: .2; mask-image: linear-gradient(to bottom, black, transparent 72%); }
    body::after { position: fixed; top: -18rem; right: -12rem; z-index: -1; width: 40rem; height: 40rem; border: 1px solid var(--line); border-radius: 50%; content: ""; box-shadow: 0 0 0 5rem rgba(52, 95, 112, .04), 0 0 0 10rem rgba(52, 95, 112, .025); }
    a { color: inherit; }

    .site-header, main { width: min(1160px, calc(100% - 48px)); margin: 0 auto; }
    .site-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; }
    .wordmark { display: inline-flex; align-items: center; gap: 10px; font-size: .76rem; font-weight: 700; letter-spacing: .13em; text-decoration: none; text-transform: uppercase; }
    .wordmark-mark { width: 52px; height: 52px; object-fit: contain; border: 0; border-radius: 0; }
    .theme-control { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); }
    .theme-button { border: 0; border-radius: 999px; padding: 7px 11px; color: var(--muted); background: transparent; cursor: pointer; font: 600 .68rem var(--sans); letter-spacing: .04em; }
    .theme-button[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); }
    .theme-button:focus-visible, .link-item:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

    .hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, .62fr); gap: clamp(48px, 10vw, 150px); align-items: center; min-height: calc(100vh - 90px); padding: clamp(55px, 10vh, 120px) 0 90px; }
    h1 { max-width: 700px; margin: 0; font-family: var(--display); font-size: clamp(4.3rem, 10vw, 9.4rem); font-weight: 400; letter-spacing: 0; line-height: .9; }
    .tagline { max-width: 360px; margin: 28px 0 0; color: var(--muted); font-family: "PingFang TC", "Noto Sans TC", var(--sans); font-size: clamp(1rem, 1.5vw, 1.2rem); letter-spacing: .04em; line-height: 1.7; }
    .hero-note { padding: 30px 0 30px 34px; border-left: 1px solid var(--line); }
    .hero-note p { max-width: 310px; margin: 0; font-family: var(--display); font-size: clamp(1.8rem, 3.2vw, 3rem); letter-spacing: 0; line-height: 1.12; }
    .hero-note em { color: var(--blue); }

    .links-section { padding-bottom: 72px; }
    .link-list { border-top: 1px solid var(--line); }
    .link-item { display: grid; grid-template-columns: 1fr 42px; gap: 18px; align-items: center; min-height: 92px; border-bottom: 1px solid var(--line); text-decoration: none; transition: padding 220ms ease, background 220ms ease; }
    .link-item:hover { padding: 0 20px; background: var(--surface); }
    .link-name { font-family: var(--display); font-size: clamp(1.8rem, 3.2vw, 2.7rem); letter-spacing: 0; }
    .link-arrow { display: grid; width: 38px; height: 38px; place-items: center; color: var(--muted); font-family: var(--sans); font-size: 1.35rem; font-weight: 400; line-height: 1; transition: color 180ms ease, transform 180ms ease; }
    .link-item:hover .link-arrow { color: var(--blue); font-size: 1.7rem; font-weight: 700; transform: translate(4px, -4px); }
    .reveal { animation: reveal 800ms both cubic-bezier(.22, .8, .3, 1); }
    .delay { animation-delay: 140ms; }
    @keyframes reveal { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 720px) {
      .site-header, main { width: min(100% - 36px, 560px); }
      .site-header { padding-top: 20px; }
      .hero { display: block; min-height: auto; padding: 70px 0 80px; }
      h1 { font-size: clamp(4.2rem, 20vw, 7rem); }
      .hero-note { margin-top: 72px; padding-left: 22px; }
      .link-item { grid-template-columns: 1fr 38px; gap: 10px; min-height: 82px; }
      .link-item:hover { padding: 0 12px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="site-header reveal">
    <a class="wordmark" href="./" aria-label="Wilson LIN home"><img class="wordmark-mark" src="./visual_identity.svg" alt="Wilson LIN visual identity"><span>Bonjour!</span></a>
    <div class="theme-control" aria-label="Color theme">
      <button class="theme-button" type="button" data-theme-choice="system" aria-pressed="true">Auto</button>
      <button class="theme-button" type="button" data-theme-choice="light" aria-pressed="false">Light</button>
      <button class="theme-button" type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
    </div>
  </header>

  <main>
    <section class="hero" aria-labelledby="page-title">
      <div class="reveal delay">
        <h1 id="page-title">Wilson<br>LIN.</h1>
        <p class="tagline">很高興認識你，一起寫下未來的故事吧！</p>
      </div>
      <div class="hero-note reveal delay">
        <p>Ideas, experiments, and <em>unexpected moments.</em></p>
      </div>
    </section>

    <section class="links-section reveal delay" aria-label="Main links">
      <nav class="link-list">
        <a class="link-item" href="https://line.me/ti/p/BDh11L0Dnd" target="_blank" rel="noopener noreferrer"><span class="link-name">LINE</span><span class="link-arrow" aria-hidden="true">↗</span></a>
        <a class="link-item" href="https://www.instagram.com/wilsonlin9769" target="_blank" rel="noopener noreferrer"><span class="link-name">Instagram</span><span class="link-arrow" aria-hidden="true">↗</span></a>
        <a class="link-item" href="./terminal/"><span class="link-name">Terminal</span><span class="link-arrow" aria-hidden="true">↗</span></a>
      </nav>
    </section>
  </main>

  <script>
    const root = document.documentElement;
    const themeButtons = document.querySelectorAll('[data-theme-choice]');
    const savedTheme = localStorage.getItem('wilson-theme') || 'system';

    function setTheme(theme) {
      if (theme === 'system') root.removeAttribute('data-theme');
      else root.dataset.theme = theme;
      themeButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.themeChoice === theme)));
      localStorage.setItem('wilson-theme', theme);
    }

    themeButtons.forEach((button) => button.addEventListener('click', () => setTheme(button.dataset.themeChoice)));
    setTheme(savedTheme);
  </script>
</body>
</html>
